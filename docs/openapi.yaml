openapi: 3.0.3
info:
  title: TeamFlow API
  version: 0.1.0
  description: |
    Outline contract for the MVP. Cookie JWT auth (see docs/adr/0002-cookie-jwt-auth.md).
    Errors use RFC 7807 `application/problem+json`.
    Resource authorization is server-side; workspace role is not taken from the JWT.
  contact:
    name: TeamFlow
servers:
  - url: http://localhost:8080
    description: Local API (Compose or Spring Boot)
security:
  - cookieAuth: []
    csrfHeader: []

tags:
  - name: auth
  - name: workspaces
  - name: members
  - name: projects
  - name: tasks
  - name: comments
  - name: audit
  - name: ops

paths:
  /api/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Register and establish cookies
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; access, refresh, and CSRF cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Problem"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clear auth cookies
      operationId: logout
      responses:
        "204":
          description: Cookies cleared
        "401":
          $ref: "#/components/responses/Problem"

  /api/auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotate access token using refresh cookie
      operationId: refresh
      responses:
        "204":
          description: New access (and possibly refresh) cookies
        "401":
          $ref: "#/components/responses/Problem"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Problem"

  /api/workspaces:
    get:
      tags: [workspaces]
      summary: Workspaces the current user belongs to
      operationId: listWorkspaces
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [workspaces]
      summary: Create workspace; creator becomes ADMIN
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /api/workspaces/{workspaceId}:
    get:
      tags: [workspaces]
      summary: Get workspace if member
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /api/workspaces/{workspaceId}/members:
    get:
      tags: [members]
      summary: List members (any member)
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [members]
      summary: Add member by email (ADMIN)
      operationId: addMember
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/workspaces/{workspaceId}/members/{userId}:
    patch:
      tags: [members]
      summary: Change role (ADMIN)
      operationId: updateMemberRole
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [members]
      summary: Remove member (ADMIN); cannot remove last ADMIN
      operationId: removeMember
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/workspaces/{workspaceId}/projects:
    post:
      tags: [projects]
      summary: Create project (ADMIN or MEMBER)
      operationId: createProject
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    get:
      tags: [projects]
      summary: List projects in workspace
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "403":
          $ref: "#/components/responses/Problem"

  /api/projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [projects]
      summary: Update project (ADMIN)
      operationId: updateProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          $ref: "#/components/responses/Problem"

  /api/projects/{projectId}/tasks:
    get:
      tags: [tasks]
      summary: Paginated, filterable task list
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: "e.g. createdAt,desc | dueDate,asc | priority,desc"
          schema:
            type: string
            default: createdAt,desc
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [tasks]
      summary: Create task (ADMIN, MEMBER)
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /api/tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [tasks]
      summary: Update task; requires matching version
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: Stale version
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/OptimisticLockProblem"
    delete:
      tags: [tasks]
      summary: Delete task (ADMIN, MEMBER)
      operationId: deleteTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Problem"

  /api/tasks/{taskId}/comments:
    get:
      tags: [comments]
      operationId: listComments
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentResponse"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [comments]
      summary: Add comment (ADMIN, MEMBER)
      operationId: addComment
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"

  /api/audit-events:
    get:
      tags: [audit]
      summary: History for an entity the caller can access
      operationId: listAuditEvents
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [TASK, PROJECT, WORKSPACE, MEMBER]
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "403":
          $ref: "#/components/responses/Problem"

  /actuator/health:
    get:
      tags: [ops]
      security: []
      summary: Liveness/readiness for Compose and CI
      operationId: health
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: RFC 7807 error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      enum: [ADMIN, MEMBER, VIEWER]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserProfile:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    WorkspaceResponse:
      type: object
      required: [id, name, myRole]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        myRole:
          $ref: "#/components/schemas/Role"

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    MemberResponse:
      type: object
      required: [userId, email, displayName, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000

    ProjectResponse:
      type: object
      required: [id, workspaceId, name]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 8000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true

    UpdateTaskRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true

    TaskResponse:
      type: object
      required: [id, projectId, title, status, priority, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TaskResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000

    CommentResponse:
      type: object
      required: [id, taskId, authorId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditEventResponse:
      type: object
      required: [id, actorId, action, entityType, entityId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEventResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    OptimisticLockProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            currentVersion:
              type: integer
