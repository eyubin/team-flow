name: release

# Builds and publishes immutable images after CI has passed on main, then
# deploys them to the staging ECS cluster. Named "release", not "CD", per
# this repo's own convention: a real continuous-delivery pipeline only earns
# that name once it deploys somewhere real, which this now does.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teamflow-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/teamflow-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/teamflow-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/teamflow-frontend:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.url.outputs.staging_url }}
    permissions:
      id-token: write # required for AWS OIDC federation
      contents: read
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
      OWNER: ${{ github.repository_owner }}
      CLUSTER: teamflow-staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Render and register backend task definition
        id: backend-taskdef
        run: |
          aws ecs describe-task-definition --task-definition teamflow-staging-backend \
            --query taskDefinition > raw.json
          jq --arg IMAGE "ghcr.io/$OWNER/teamflow-backend:$IMAGE_TAG" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMAGE
          ' raw.json > new.json
          arn=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Run database migration as a one-off task
        run: |
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "${{ steps.backend-taskdef.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_BACKEND_SG }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["--spring.main.web-application-type=none"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration task exited with code $exit_code -- aborting deploy, service is untouched."
            exit 1
          fi

      - name: Deploy backend service
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service backend \
            --task-definition "${{ steps.backend-taskdef.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services backend

      - name: Render and register frontend task definition
        id: frontend-taskdef
        run: |
          aws ecs describe-task-definition --task-definition teamflow-staging-frontend \
            --query taskDefinition > raw.json
          jq --arg IMAGE "ghcr.io/$OWNER/teamflow-frontend:$IMAGE_TAG" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions[0].image = $IMAGE
          ' raw.json > new.json
          arn=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend service
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service frontend \
            --task-definition "${{ steps.frontend-taskdef.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services frontend

      - name: Resolve staging URL
        id: url
        run: |
          dns=$(aws elbv2 describe-load-balancers --names teamflow-staging \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "staging_url=http://$dns" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          curl -fsS "${{ steps.url.outputs.staging_url }}/actuator/health" | grep -q '"status":"UP"'
          curl -fsS "${{ steps.url.outputs.staging_url }}/" | grep -q TeamFlow
