name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify
        working-directory: backend

  compose-smoke:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker-compose.yml up --build -d --wait
      - run: curl -fsS http://localhost:8080/actuator/health | grep '"status":"UP"'
      - run: curl -fsS http://localhost:3000/actuator/health | grep '"status":"UP"'
      - run: curl -fsS http://localhost:3000/ | grep -q TeamFlow
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down -v
