services:
  frontend:
    build:
      target: dev
    ports: !override
      - "${FRONTEND_PORT}:5173"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      disable: true

volumes:
  frontend_node_modules:
